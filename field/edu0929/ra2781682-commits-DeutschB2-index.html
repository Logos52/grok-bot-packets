 const show=()=>{const w=L[i];V.innerHTML=`<div class="panel"><div class="sc">کارت ${i+1} له ${L.length} · کارت ته ټک ورکړه</div><div class="fc" id="fc"><div class="fi"><div class="fs a">${de(w.g)}<small>🔊 ټک ورکړه</small></div><div class="fs b">${w.r}<small>${w.c}</small></div></div></div>

 V.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{if(!sel){sel=b;b.classList.add("sel");return}if(sel==b)return;const a=t[sel.dataset.i],c=t[b.dataset.i];
  if(a.k==c.k){sel.className=b.className="tile ok";known.add(a.k);save();prog();if(++done==L.length)$("fb").textContent="🎉 ډېر ښه!"}
  else{const s=sel;s.classList.remove("sel");s.classList.add("no");b.classList.add("no");setTimeout(()=>{s.className=b.className="tile"},500)}sel=null})}
function type(){let L=sh(pool()),i=0;
 const show=()=>{if(i>=L.length)i=0;const w=L[i];V.innerHTML=`<div class="panel"><div class="sc">آلماني لغت ولیکه</div><div class="q">${w.r}</div><input id="in" dir="ltr" style="width:100%;max-width:340px;text-align:center" autocomplete="off" placeholder="…"><div class="fb" id="fb"></div><div class="row"><button class="btn" id="ck">وګوره</button><button class="btn l" id="sk">پریږده</button></div></div>`;
 const n=s=>s.toLowerCase().replace(/^(der|die|das) /,"").trim();
 const chk=()=>{if(n($("in").value)==n(w.g)){$("fb").style.color="var(--ok)";$("fb").innerHTML="✓ سم دی: "+de(w.g);known.add(w.id);save();prog();i++;setTimeout(show,1000)}else{$("fb").style.color="var(--bad)";$("fb").textContent="✗ بیا هڅه وکړه"}};
 $("ck").onclick=chk;$("in").onkeydown=e=>{if(e.key=="Enter")chk()};$("sk").onclick=()=>{$("fb").innerHTML="ځواب: "+de(w.g);i++;setTimeout(show,1400)};$("in").focus()};show()}
function artG(){let L=sh(pool().filter(art)),i=0,s=0;if(!L.length){V.innerHTML='<div class="panel">په دې ډله کې اسمونه نشته.</div>';return}
 const show=()=>{if(i>=L.length){V.innerHTML=`<div class="panel"><h2>پایله: ${s} له ${L.length}</h2><button class="btn" onclick="go()">بیا پیل</button></div>`;return}
 const w=L[i];V.innerHTML=`<div class="panel"><div class="sc">کوم آرټیکل لري؟ · نمره ${s}</div><div class="q">${de("___ "+w.g.replace(/^(der|die|das) /,""))}</div><div class="sc">${w.r}</div><div class="row"><button class="btn" data-a="der">der</button><button class="btn" data-a="die">die</button><button class="btn" data-a="das">das</button></div><div class="fb" id="fb"></div></div>`;
 V.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const ok=b.dataset.a==art(w);if(ok)s++;$("fb").style.color=ok?"var(--ok)":"var(--bad)";$("fb").innerHTML=ok?"✓ سم دی!":"✗ سم دی: "+de(w.g);V.querySelectorAll("[data-a]").forEach(x=>x.disabled=true);setTimeout(()=>{i++;show()},1000)})};show()}

 r();$("q").oninput=r;$("t").onclick=e=>{if(e.target.dataset.s)say(e.target.dataset.s)}}
