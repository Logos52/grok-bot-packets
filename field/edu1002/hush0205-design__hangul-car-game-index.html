<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="한글 자동차">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>하늘에서 내려오는 한글 자동차</title>
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: manipulation; overscroll-behavior: none;
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #1d2a3a; }
  body { background: linear-gradient(#7ec8f2 0%, #bfe6fb 60%, #e9f7ff 100%); }
  button { font-family: inherit; cursor: pointer; border: none; }

  /* ── 공통 화면 ── */
  .screen { position: fixed; inset: 0; display: none; }
  .screen.on { display: block; }

  /* ── 시작 화면 ── */
  #menu { overflow-y: auto; padding: max(24px, env(safe-area-inset-top)) 24px 30px; text-align: center; }
  #menu h1 { font-size: clamp(30px, 5vw, 50px); margin: 6px 0 4px; letter-spacing: -1px; text-shadow: 0 3px 0 #fff; }
  #menu .sub { font-size: 20px; color: #2b5d7d; margin-bottom: 18px; }
  .levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; max-width: 980px; margin: 0 auto; }
  .lv { background: #fff; border-radius: 22px; padding: 16px 12px 12px; box-shadow: 0 6px 0 #5aa7d6; border: 4px solid transparent; }
  .lv.sel { border-color: #f39c12; box-shadow: 0 6px 0 #d07f00; background: #fff8e6; }
  .lv .t { font-size: 26px; font-weight: 800; }
  .lv .d { font-size: 17px; color: #555; margin-top: 4px; min-height: 2.4em; }
  .lv .st { font-size: 20px; margin-top: 6px; color: #e2a100; min-height: 1.3em; }
  .opts { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin: 22px auto 0; max-width: 980px; }
  .grp { background: rgba(255,255,255,.7); border-radius: 18px; padding: 8px; display: flex; gap: 8px; }
  .grp button { font-size: 21px; padding: 12px 18px; border-radius: 14px; background: #fff; color: #333; }
  .grp button.sel { background: #2e86de; color: #fff; }
  #go { margin-top: 24px; font-size: 36px; font-weight: 800; padding: 18px 70px; border-radius: 40px; background: #e74c3c; color: #fff; box-shadow: 0 7px 0 #a93226; }
  #go:active { transform: translateY(4px); box-shadow: 0 3px 0 #a93226; }
  .hint { font-size: 15px; color: #4a6b80; margin-top: 16px; line-height: 1.6; }

  /* ── 게임 화면 ── */
  #bar { position: absolute; left: 0; right: 0; top: 0; height: 120px; padding: max(10px, env(safe-area-inset-top)) 16px 10px;
    display: flex; align-items: center; gap: 16px; background: rgba(255,255,255,.85); box-shadow: 0 3px 10px rgba(0,0,0,.1); z-index: 5; }
  #say { width: 92px; height: 92px; border-radius: 50%; background: #f39c12; color: #fff; font-size: 44px; box-shadow: 0 5px 0 #c27c0e; flex: none; }
  #say:active { transform: translateY(3px); box-shadow: 0 2px 0 #c27c0e; }
  #target { min-width: 120px; height: 92px; padding: 0 18px; border-radius: 20px; background: #fff; border: 4px dashed #f39c12;
    display: flex; align-items: center; justify-content: center; font-size: 60px; font-weight: 800; flex: none; }
  #target.word { font-size: 44px; }
  #road { flex: 1; height: 54px; border-radius: 27px; background: #555; position: relative; overflow: hidden; }
  #road::before { content: ""; position: absolute; left: 10px; right: 50px; top: 25px; border-top: 4px dashed #fff; }
  #road .flag { position: absolute; right: 10px; top: 6px; font-size: 34px; }
  #road .me { position: absolute; top: 4px; left: 6px; width: 70px; transition: left .5s; }
  #road .cnt { position: absolute; left: 50%; top: 9px; transform: translateX(-50%); color: #fff; font-size: 28px; font-weight: 800; text-shadow: 0 2px 2px #000; }
  #quit { font-size: 22px; padding: 14px 18px; border-radius: 16px; background: #eee; color: #444; flex: none; }
  #sky { position: absolute; left: 0; right: 0; top: 120px; bottom: 0; overflow: hidden; }
  .cloud { position: absolute; background: #fff; border-radius: 60px; opacity: .8; }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
  .cloud::before { width: 60%; height: 150%; left: 15%; top: -60%; }
  .cloud::after { width: 40%; height: 120%; right: 10%; top: -40%; }
  #ground { position: absolute; left: 0; right: 0; bottom: 0; height: 46px; background: #5c6770; border-top: 6px solid #7fbf5a; }
  #ground::after { content: ""; position: absolute; left: 0; right: 0; top: 18px; border-top: 5px dashed #f5d76e; }

  .drop { position: absolute; top: 0; left: 0; width: 180px; will-change: transform; touch-action: none; }
  .drop.word { width: 230px; }
  .drop svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .drop.wrong { animation: shake .35s; }
  @keyframes shake { 0%,100% { margin-left: 0 } 25% { margin-left: -14px } 75% { margin-left: 14px } }
  .drop.pop { transition: opacity .35s, filter .35s; opacity: 0; filter: brightness(1.8); }
  .plus { position: absolute; font-size: 54px; font-weight: 900; color: #f39c12; text-shadow: 0 3px 0 #fff; pointer-events: none;
    animation: up .9s forwards; z-index: 4; }
  @keyframes up { from { transform: translateY(0); opacity: 1 } to { transform: translateY(-90px); opacity: 0 } }

  /* ── 끝 화면 ── */
  #done { text-align: center; padding-top: 12vh; background: rgba(255,255,255,.55); }
  #done .big { font-size: 120px; line-height: 1; }
  #done h2 { font-size: 48px; margin: 10px 0; }
  #done p { font-size: 26px; color: #2b5d7d; }
  #done button { font-size: 30px; font-weight: 800; padding: 16px 40px; border-radius: 30px; margin: 14px 10px; color: #fff; }
  #again { background: #e74c3c; box-shadow: 0 6px 0 #a93226; }
  #home { background: #2e86de; box-shadow: 0 6px 0 #1f5f9e; }
  #pausebox { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 9; background: rgba(0,0,0,.35); }
  #pausebox.on { display: flex; }
  #pausebox div { background: #fff; border-radius: 26px; padding: 30px 40px; text-align: center; }
  #pausebox button { font-size: 28px; font-weight: 800; padding: 14px 34px; border-radius: 24px; margin: 10px; color: #fff; }
</style>
</head>
<body>

<!-- 시작 화면 -->
<div id="menu" class="screen on">
  <h1>🪂 하늘에서 내려오는 한글 자동차</h1>
  <div class="sub">소리를 듣고, 맞는 자동차를 톡! 눌러요</div>
  <div class="levels" id="levels"></div>
  <div class="opts">
    <div class="grp" id="modeGrp">
      <button data-v="see" class="sel">👀 보고 찾기</button>
      <button data-v="hear">👂 듣고 찾기</button>
    </div>
    <div class="grp" id="speedGrp">
      <button data-v="0">🐢 천천히</button>
      <button data-v="1" class="sel">🚗 보통</button>
      <button data-v="2">🏎 빠르게</button>
    </div>
  </div>
  <button id="go">출발! 🚦</button>
  <div class="hint">🔊 소리가 안 나면: 아이패드 옆 무음 스위치를 끄고, 음량을 올려 주세요.<br>
  ‘보고 찾기’는 글자를 보여 주고, ‘듣고 찾기’는 소리만 들려줘요(더 어려워요). 10대를 맞히면 별 ⭐ 하나!</div>
</div>

<!-- 게임 화면 -->
<div id="game" class="screen">
  <div id="bar">
    <button id="say" aria-label="다시 듣기">🔊</button>
    <div id="target">?</div>
    <div id="road"><span class="flag">🏁</span><div class="me" id="me"></div><span class="cnt" id="cnt">0 / 10</span></div>
    <button id="quit">⏸</button>
  </div>
  <div id="sky"><div id="ground"></div></div>
  <div id="pausebox"><div>
    <div style="font-size:34px;font-weight:800;margin-bottom:10px">잠깐 쉬어요 ☕</div>
    <button style="background:#27ae60" id="resume">계속하기</button>
    <button style="background:#2e86de" id="toMenu">처음으로</button>
  </div></div>
</div>

<!-- 끝 화면 -->
<div id="done" class="screen">
  <div class="big">🏆</div>
  <h2 id="doneT">10대 성공!</h2>
  <p id="doneP"></p>
  <button id="again">한 번 더!</button>
  <button id="home">처음으로</button>
</div>

<script>
(function () {
  'use strict';
  // ───────── 한글 도구 ─────────
  var CHO = [0, 2, 3, 5, 6, 7, 9, 11, 12, 14, 15, 16, 17, 18];        // ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎ
  var V = { a: 0, ya: 2, eo: 4, yeo: 6, o: 8, yo: 12, u: 13, yu: 17, eu: 18, i: 20 };
  function mk(c, j) { return String.fromCharCode(0xAC00 + (c * 21 + j) * 28); }
  function parts(s) { var n = s.charCodeAt(0) - 0xAC00; return [Math.floor(n / 588), Math.floor((n % 588) / 28)]; }
  function table(vs) { var r = []; vs.forEach(function (j) { CHO.forEach(function (c) { r.push(mk(c, j)); }); }); return r; }
  // 헷갈리는 짝: 약한 소리↔센소리, 비슷한 모음
  var CHO_PAIR = { 0: [15], 15: [0], 3: [16], 16: [3], 7: [17], 17: [7], 12: [14], 14: [12], 11: [18], 18: [11], 2: [3], 9: [12] };
  var V_PAIR = { 0: [4, 2], 4: [0, 8, 6], 8: [13, 4, 12], 13: [8, 17], 18: [20], 20: [18], 2: [0, 6], 6: [4, 2], 12: [8, 17], 17: [13, 12] };

  var WORDS = ["거미", "머리", "버스", "허리", "스키", "고기", "모자", "포도", "토마토", "도토리",
    "구두", "두부", "우주", "누구", "주스", "기차", "비누", "치마", "피자", "지구",
    "치즈", "기타", "타조", "카드", "파도", "고추", "하마", "호수", "야구", "여우",
    "여자", "요리", "우유", "휴지", "요요", "아버지", "너구리", "오토바이", "타이어", "요구르트"];
  var CARS = ["기아", "토요타", "아우디", "포드", "미니", "지프", "스바루", "스즈키", "피아트", "푸조",
    "르노", "라다", "지리", "부가티", "로터스", "스코다"];

  var LEVELS = [
    { t: "1단계", d: "ㅏ ㅓ ㅗ ㅜ 글자<br>(가 거 고 구…)", pool: table([V.a, V.eo, V.o, V.u]), syl: true },
    { t: "2단계", d: "ㅡ ㅣ + 센소리<br>(가/카 · 바/파…)", pool: table([V.a, V.eo, V.o, V.u, V.eu, V.i]), syl: true, strong: true },
    { t: "3단계", d: "ㅑ ㅕ ㅛ ㅠ 까지<br>140글자 전부", pool: table([V.a, V.ya, V.eo, V.yeo, V.o, V.yo, V.u, V.yu, V.eu, V.i]), syl: true },
    { t: "4단계", d: "낱말 40개<br>(기차 · 피자 · 우유…)", pool: WORDS, syl: false },
    { t: "🚗 자동차", d: "자동차 이름<br>(기아 · 토요타 · 푸조…)", pool: CARS, syl: false }
  ];
  var GOAL = 10;
  var SPEED = [ { fall: 11000, gap: 1700, max: 4 }, { fall: 8500, gap: 1350, max: 5 }, { fall: 6200, gap: 1050, max: 6 } ];
  var COLORS = ["#e74c3c", "#2e86de", "#27ae60", "#f39c12", "#8e44ad", "#16a085", "#d35400", "#e84393"];

  var st = { lv: 0, mode: "see", speed: 1 };
  try { var saved = JSON.parse(localStorage.getItem("hangulCarSet") || "{}"); Object.assign(st, saved); } catch (e) {}
  function stars() { try { return JSON.parse(localStorage.getItem("hangulCarStars") || "{}"); } catch (e) { return {}; } }
  function addStar(i) { var s = stars(); s[i] = (s[i] || 0) + 1; localStorage.setItem("hangulCarStars", JSON.stringify(s)); return s[i]; }
  function saveSet() { localStorage.setItem("hangulCarSet", JSON.stringify({ lv: st.lv, mode: st.mode, speed: st.speed })); }

  // ───────── 소리 ─────────
  var ac = null;
  function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === "suspended") ac.resume(); return ac; }
  function tone(freqs, dur, type, vol) {
    var a = audio(); if (!a) return;
    freqs.forEach(function (f, i) {
      var o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime + i * 0.09;
      o.type = type || "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol || 0.25, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.05);
    });
  }
  function ding() { tone([660, 880, 1175], 0.35, "triangle", 0.3); }
  function buzz() { tone([180], 0.25, "square", 0.08); }
  function fanfare() { tone([523, 659, 784, 1047, 1319], 0.5, "triangle", 0.3); }

  var koVoice = null;
  function pickVoice() {
    if (!window.speechSynthesis) return;
    var vs = speechSynthesis.getVoices().filter(function (v) { return /^ko/i.test(v.lang); });
    koVoice = vs.filter(function (v) { return /yuna|유나|premium|enhanced/i.test(v.name); })[0] || vs[0] || null;
  }
  if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function speak(text, rate) {
    if (!window.speechSynthesis) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "ko-KR"; if (koVoice) u.voice = koVoice;
    u.rate = rate || 0.8; u.pitch = 1.1;
    speechSynthesis.speak(u);
  }

  // ───────── 그림 ─────────
  function dropSVG(label, color, isWord) {
    var fs = isWord ? (label.length >= 4 ? 40 : 48) : 66;
    var w = isWord ? 260 : 200;
    var cx = w / 2;
    return '<svg viewBox="0 0 ' + w + ' 230" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M8 96 Q' + cx + ' -62 ' + (w - 8) + ' 96 Q' + (w * 0.875) + ' 80 ' + (w * 0.75) + ' 96 Q' + (w * 0.625) + ' 80 ' + cx +
      ' 96 Q' + (w * 0.375) + ' 80 ' + (w * 0.25) + ' 96 Q' + (w * 0.125) + ' 80 8 96 Z" fill="' + color + '" stroke="#fff" stroke-width="4"/>' +
      '<line x1="14" y1="96" x2="' + (cx - 46) + '" y2="160" stroke="#555" stroke-width="2.5"/>' +
      '<line x1="' + (w - 14) + '" y1="96" x2="' + (cx + 46) + '" y2="160" stroke="#555" stroke-width="2.5"/>' +
      '<line x1="' + cx + '" y1="96" x2="' + cx + '" y2="158" stroke="#555" stroke-width="2.5"/>' +
      '<text x="' + cx + '" y="' + (isWord ? 74 : 80) + '" text-anchor="middle" font-size="' + fs + '" font-weight="900" fill="#fff" ' +
      'stroke="rgba(0,0,0,.35)" stroke-width="3" paint-order="stroke" font-family="-apple-system, Apple SD Gothic Neo, sans-serif">' + label + '</text>' +
      '<g transform="translate(' + (cx - 63) + ',150) scale(0.6)">' + carPath(color) + '</g></svg>';
  }
  function carPath(color) {
    return '<path d="M10 66 L10 48 Q10 39 22 37 L52 33 L78 13 Q84 8 95 8 L142 8 Q152 8 158 14 L180 33 Q200 36 202 48 L202 66 Z" fill="' + color + '" stroke="#222" stroke-width="3"/>' +
      '<path d="M60 33 L82 15 L106 15 L106 33 Z" fill="#dff1ff" stroke="#222" stroke-width="2"/>' +
      '<path d="M113 15 L140 15 Q146 15 150 19 L166 33 L113 33 Z" fill="#dff1ff" stroke="#222" stroke-width="2"/>' +
      '<circle cx="52" cy="68" r="15" fill="#222"/><circle cx="52" cy="68" r="6" fill="#bbb"/>' +
      '<circle cx="160" cy="68" r="15" fill="#222"/><circle cx="160" cy="68" r="6" fill="#bbb"/>';
  }
  function carSVG(color) { return '<svg viewBox="0 0 210 86" width="100%">' + carPath(color) + '</svg>'; }

  // ───────── 메뉴 ─────────
  var $ = function (id) { return document.getElementById(id); };
  function show(id) { ["menu", "game", "done"].forEach(function (s) { $(s).classList.toggle("on", s === id); }); }
  function drawMenu() {
    var s = stars();
    $("levels").innerHTML = LEVELS.map(function (L, i) {
      var n = s[i] || 0;
      var starTxt = n ? (n <= 8 ? "⭐".repeat(n) : "⭐ × " + n) : "";
      return '<button class="lv' + (i === st.lv ? " sel" : "") + '" data-i="' + i + '"><div class="t">' + L.t + '</div><div class="d">' + L.d +
        '</div><div class="st">' + starTxt + '</div></button>';
    }).join("");
    Array.prototype.forEach.call(document.querySelectorAll("#modeGrp button"), function (b) { b.classList.toggle("sel", b.dataset.v === st.mode); });
    Array.prototype.forEach.call(document.querySelectorAll("#speedGrp button"), function (b) { b.classList.toggle("sel", +b.dataset.v === st.speed); });
  }
  $("levels").addEventListener("click", function (e) { var b = e.target.closest(".lv"); if (!b) return; st.lv = +b.dataset.i; saveSet(); drawMenu(); });
  $("modeGrp").addEventListener("click", function (e) { var b = e.target.closest("button"); if (!b) return; st.mode = b.dataset.v; saveSet(); drawMenu(); });
  $("speedGrp").addEventListener("click", function (e) { var b = e.target.closest("button"); if (!b) return; st.speed = +b.dataset.v; saveSet(); drawMenu(); });

  // ───────── 게임 ─────────
  var g = null, raf = 0;
  function rnd(a) { return a[Math.floor(Math.random() * a.length)]; }

  function distractor() {
    var L = LEVELS[st.lv], pool = L.pool, tgt = g.target, onScreen = g.items.map(function (it) { return it.label; });
    var cand = [];
    if (L.syl && Math.random() < 0.55) {
      var p = parts(tgt);
      (CHO_PAIR[p[0]] || []).forEach(function (c) { cand.push(mk(c, p[1])); });
      (V_PAIR[p[1]] || []).forEach(function (j) { cand.push(mk(p[0], j)); });
      if (L.strong) (CHO_PAIR[p[0]] || []).forEach(function (c) { cand.push(mk(c, p[1])); });
      cand = cand.filter(function (s) { return pool.indexOf(s) >= 0; });
    }
    if (!L.syl && Math.random() < 0.5) {
      // 첫 글자가 같거나 길이가 같은 낱말
      cand = pool.filter(function (w) { return w !== tgt && (w[0] === tgt[0] || w.length === tgt.length); });
    }
    for (var k = 0; k < 20; k++) {
      var s = cand.length ? rnd(cand) : rnd(pool);
      if (s !== tgt && onScreen.indexOf(s) < 0) return s;
      cand = [];
    }
    return null;
  }

  function newTarget() {
    var pool = LEVELS[st.lv].pool, t;
    do { t = rnd(pool); } while (g.recent.indexOf(t) >= 0 && pool.length > 6);
    g.recent.push(t); if (g.recent.length > 5) g.recent.shift();
    g.target = t; g.sinceTarget = 9;   // 다음 낙하에 바로 정답이 나오게
    var tg = $("target");
    tg.classList.toggle("word", !LEVELS[st.lv].syl);
    tg.textContent = st.mode === "see" ? t : "?";
    setTimeout(function () { speak(t); }, 250);
  }

  function spawn() {
    var sp = SPEED[st.speed], sky = $("sky");
    if (g.items.length >= sp.max) return;
    var hasTarget = g.items.some(function (it) { return it.label === g.target && !it.dead; });
    var label;
    if (!hasTarget && (g.sinceTarget >= 2 || Math.random() < 0.45)) { label = g.target; g.sinceTarget = 0; }
    else { label = distractor(); g.sinceTarget++; if (!label) return; }
    var isWord = !LEVELS[st.lv].syl;
    var el = document.createElement("div");
    el.className = "drop" + (isWord ? " word" : "");
    var color = COLORS[g.colorI++ % COLORS.length];
    el.innerHTML = dropSVG(label, color, isWord);
    sky.appendChild(el);
    var W = sky.clientWidth, ew = isWord ? 230 : 180;
    // 다른 낙하물과 겹치지 않는 x 고르기
    var x = 0;
    for (var k = 0; k < 12; k++) {
      x = 10 + Math.random() * Math.max(10, W - ew - 20);
      var ok = g.items.every(function (it) { return Math.abs(it.x - x) > ew * 0.85 || it.y > 260; });
      if (ok) break;
    }
    var it = { el: el, label: label, x: x, y: -260, v: (sky.clientHeight + 260) / sp.fall, sway: Math.random() * 6.28, dead: false };
    el.addEventListener("pointerdown", function (e) { e.preventDefault(); hit(it, e); });
    g.items.push(it);
  }

  function hit(it, e) {
    if (it.dead || !g || g.paused || g.over) return;
    audio();
    if (it.label === g.target) {
      it.dead = true; ding();
      var r = it.el.getBoundingClientRect(), sky = $("sky").getBoundingClientRect();
      var p = document.createElement("div"); p.className = "plus"; p.textContent = "+1";
      p.style.left = (r.left - sky.left + r.width / 2 - 25) + "px"; p.style.top = (r.top - sky.top + 20) + "px";
      $("sky").appendChild(p); setTimeout(function () { p.remove(); }, 900);
      it.el.classList.add("pop"); setTimeout(function () { it.el.remove(); }, 380);
      g.score++; drawProgress();
      if (g.score >= GOAL) { setTimeout(finish, 600); return; }
      setTimeout(function () { if (g && !g.over) newTarget(); }, 700);
    } else {
      buzz(); g.miss++;
      it.el.classList.remove("wrong"); void it.el.offsetWidth; it.el.classList.add("wrong");
      setTimeout(function () { speak(it.label, 0.85); }, 150);   // 누른 글자 소리 들려주기
      setTimeout(function () { if (g && !g.over) speak(g.target); }, 1400); // 다시 정답 소리
    }
  }

  function drawProgress() {
    $("cnt").textContent = g.score + " / " + GOAL;
    var road = $("road"), w = road.clientWidth - 70 - 50;
    $("me").style.left = (6 + w * g.score / GOAL) + "px";
  }

  function loop(ts) {
    if (!g || g.over) return;
    if (!g.last) g.last = ts;
    var dt = Math.min(60, ts - g.last); g.last = ts;
    if (!g.paused) {
      g.spawnT += dt;
      if (g.spawnT >= SPEED[st.speed].gap) { g.spawnT = 0; spawn(); }
      var H = $("sky").clientHeight;
      g.items = g.items.filter(function (it) {
        if (it.dead) return false;
        it.y += it.v * dt; it.sway += dt / 700;
        var sx = Math.sin(it.sway) * 10;
        it.el.style.transform = "translate(" + (it.x + sx) + "px," + it.y + "px) rotate(" + (Math.sin(it.sway) * 4) + "deg)";
        if (it.y > H - 40) { it.el.remove(); return false; }
        return true;
      });
    }
    raf = requestAnimationFrame(loop);
  }

  function clouds() {
    var sky = $("sky");
    Array.prototype.forEach.call(sky.querySelectorAll(".cloud,.drop,.plus"), function (n) { n.remove(); });
    for (var i = 0; i < 5; i++) {
      var c = document.createElement("div"); c.className = "cloud";
      var w = 90 + Math.random() * 120;
      c.style.width = w + "px"; c.style.height = (w * 0.32) + "px";
      c.style.left = (Math.random() * 90) + "%"; c.style.top = (20 + Math.random() * 55) + "%";
      sky.insertBefore(c, sky.firstChild);
    }
  }

  function start() {
    audio(); speak(" ");     // 아이패드: 첫 터치에서 소리 잠금 풀기
    cancelAnimationFrame(raf);
    g = { items: [], score: 0, miss: 0, target: null, recent: [], sinceTarget: 9, spawnT: 99999, colorI: 0, paused: false, over: false, last: 0 };
    show("game"); clouds();
    $("me").innerHTML = carSVG("#e74c3c");
    drawProgress();
    newTarget();
    raf = requestAnimationFrame(loop);
  }

  function finish() {
    if (!g) return;
    g.over = true; cancelAnimationFrame(raf);
    g.items.forEach(function (it) { it.el.remove(); });
    fanfare();
    var n = addStar(st.lv);
    $("doneT").textContent = GOAL + "대 성공! ⭐";
    $("doneP").textContent = LEVELS[st.lv].t + " 별 " + n + "개째 · 틀린 횟수 " + g.miss + "번";
    setTimeout(function () { speak("참 잘했어요!", 0.9); }, 600);
    show("done");
  }

  $("go").addEventListener("click", start);
  $("again").addEventListener("click", start);
  $("home").addEventListener("click", function () { drawMenu(); show("menu"); });
  $("say").addEventListener("pointerdown", function (e) { e.preventDefault(); audio(); if (g && g.target) speak(g.target); });
  $("target").addEventListener("pointerdown", function () { if (g && g.target) speak(g.target); });
  $("quit").addEventListener("click", function () { if (!g) return; g.paused = true; $("pausebox").classList.add("on"); });
  $("resume").addEventListener("click", function () { g.paused = false; g.last = 0; $("pausebox").classList.remove("on"); });
  $("toMenu").addEventListener("click", function () {
    $("pausebox").classList.remove("on"); if (g) { g.over = true; cancelAnimationFrame(raf); }
    if (window.speechSynthesis) speechSynthesis.cancel();
    drawMenu(); show("menu");
  });
  document.addEventListener("visibilitychange", function () { if (document.hidden && g && !g.over) { g.paused = true; $("pausebox").classList.add("on"); } });
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });

  drawMenu();
})();
</script>
</body>
</html>
