<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChatterCheck</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --bg: oklch(98% 0.006 80);
  --surface: oklch(99% 0.003 80);
  --surface-2: oklch(96% 0.007 80);
  --border: oklch(90% 0.01 260);
  --border-soft: oklch(93% 0.008 260);
  --text: oklch(24% 0.02 260);
  --text-2: oklch(46% 0.02 260);
  --text-3: oklch(60% 0.015 260);
  --accent: oklch(46% 0.15 260);
  --accent-ink: oklch(35% 0.13 260);
  --accent-tint: oklch(94% 0.025 260);
  --accent-strong: oklch(46% 0.16 260);
  --gold: oklch(58% 0.13 80);
  --gold-ink: oklch(45% 0.1 75);
  --gold-tint: oklch(94% 0.03 80);
  --good: oklch(52% 0.13 145);
  --good-tint: oklch(94% 0.035 145);
  --bad: oklch(54% 0.16 25);
  --bad-tint: oklch(94% 0.035 25);
  --warn: oklch(58% 0.13 80);
  --cat-grammar: oklch(52% 0.13 260); --cat-grammar-tint: oklch(94% 0.02 260);
  --cat-vocab: oklch(52% 0.14 330);   --cat-vocab-tint: oklch(94% 0.025 330);
  --cat-pron: oklch(55% 0.14 75);     --cat-pron-tint: oklch(94% 0.03 75);
  --cat-usage: oklch(53% 0.15 20);    --cat-usage-tint: oklch(94% 0.03 20);
  --type-vocabulary: var(--accent-strong); --type-vocabulary-tint: var(--accent-tint);
  --type-phrasal: oklch(50% 0.13 255);   --type-phrasal-tint: oklch(94% 0.02 255);
  --type-collocation: oklch(48% 0.13 300); --type-collocation-tint: oklch(94% 0.02 300);
  --type-idiom: oklch(56% 0.13 70);      --type-idiom-tint: oklch(94% 0.03 70);
  --type-metaphor: oklch(52% 0.15 10);   --type-metaphor-tint: oklch(94% 0.03 10);
  --shadow-sm: 0 1px 2px oklch(20% 0.02 260 / 0.06);
  --shadow-md: 0 4px 16px oklch(20% 0.02 260 / 0.07), 0 1px 3px oklch(20% 0.02 260 / 0.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg: oklch(21% 0.015 260); --surface: oklch(25% 0.015 260); --surface-2: oklch(28% 0.017 260);
    --border: oklch(37% 0.02 260); --border-soft: oklch(32% 0.018 260);
    --text: oklch(94% 0.006 80); --text-2: oklch(76% 0.012 260); --text-3: oklch(62% 0.012 260);
    --accent: oklch(70% 0.13 260); --accent-ink: oklch(88% 0.06 260); --accent-tint: oklch(32% 0.08 260); --accent-strong: oklch(72% 0.14 260);
    --gold: oklch(78% 0.12 85); --gold-ink: oklch(85% 0.1 85); --gold-tint: oklch(32% 0.06 80);
    --good: oklch(72% 0.14 145); --good-tint: oklch(32% 0.06 145);
    --bad: oklch(72% 0.15 25); --bad-tint: oklch(34% 0.08 25);
    --warn: oklch(76% 0.12 80);
    --cat-grammar: oklch(76% 0.1 260); --cat-grammar-tint: oklch(30% 0.05 260);
    --cat-vocab: oklch(76% 0.11 330); --cat-vocab-tint: oklch(30% 0.06 330);
    --cat-pron: oklch(78% 0.11 75); --cat-pron-tint: oklch(32% 0.06 75);
    --cat-usage: oklch(76% 0.12 20); --cat-usage-tint: oklch(32% 0.06 20);
    --type-vocabulary: var(--accent-strong); --type-vocabulary-tint: var(--accent-tint);
    --type-phrasal: oklch(76% 0.09 255); --type-phrasal-tint: oklch(30% 0.05 255);
    --type-collocation: oklch(76% 0.1 300); --type-collocation-tint: oklch(30% 0.05 300);
    --type-idiom: oklch(80% 0.11 70); --type-idiom-tint: oklch(32% 0.06 70);
    --type-metaphor: oklch(76% 0.12 10); --type-metaphor-tint: oklch(32% 0.06 10);
    --shadow-sm: 0 1px 2px oklch(0% 0 0 / 0.3); --shadow-md: 0 4px 16px oklch(0% 0 0 / 0.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg: oklch(21% 0.015 260); --surface: oklch(25% 0.015 260); --surface-2: oklch(28% 0.017 260);
  --border: oklch(37% 0.02 260); --border-soft: oklch(32% 0.018 260);
  --text: oklch(94% 0.006 80); --text-2: oklch(76% 0.012 260); --text-3: oklch(62% 0.012 260);
  --accent: oklch(70% 0.13 260); --accent-ink: oklch(88% 0.06 260); --accent-tint: oklch(32% 0.08 260); --accent-strong: oklch(72% 0.14 260);
  --gold: oklch(78% 0.12 85); --gold-ink: oklch(85% 0.1 85); --gold-tint: oklch(32% 0.06 80);
  --good: oklch(72% 0.14 145); --good-tint: oklch(32% 0.06 145);
  --bad: oklch(72% 0.15 25); --bad-tint: oklch(34% 0.08 25);
  --warn: oklch(76% 0.12 80);
  --cat-grammar: oklch(76% 0.1 260); --cat-grammar-tint: oklch(30% 0.05 260);
  --cat-vocab: oklch(76% 0.11 330); --cat-vocab-tint: oklch(30% 0.06 330);
  --cat-pron: oklch(78% 0.11 75); --cat-pron-tint: oklch(32% 0.06 75);
  --cat-usage: oklch(76% 0.12 20); --cat-usage-tint: oklch(32% 0.06 20);
  --type-vocabulary: var(--accent-strong); --type-vocabulary-tint: var(--accent-tint);
  --type-phrasal: oklch(76% 0.09 255); --type-phrasal-tint: oklch(30% 0.05 255);
  --type-collocation: oklch(76% 0.1 300); --type-collocation-tint: oklch(30% 0.05 300);
  --type-idiom: oklch(80% 0.11 70); --type-idiom-tint: oklch(32% 0.06 70);
  --type-metaphor: oklch(76% 0.12 10); --type-metaphor-tint: oklch(32% 0.06 10);
  --shadow-sm: 0 1px 2px oklch(0% 0 0 / 0.3); --shadow-md: 0 4px 16px oklch(0% 0 0 / 0.35);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  font-size:14px; line-height:1.5;
}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer;background:none}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:var(--accent-tint)}
h1,h2,h3,h4{margin:0;text-wrap:balance}
a{color:var(--accent-strong)}
:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px;border-radius:4px}

.shell{max-width:1180px;margin:0 auto;padding:22px 24px 64px}
.topbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-bottom:16px;margin-bottom:18px;border-bottom:1px solid var(--border-soft)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:white;font-size:14px;flex:0 0 auto}
.brand-name{font-size:16px;font-weight:600;letter-spacing:-0.01em}
.brand-tag{font-size:11.5px;color:var(--text-3)}

.studentbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.studentchip{display:flex;align-items:center;gap:7px;padding:5px 10px 5px 5px;border-radius:100px;border:1px solid var(--border);background:var(--surface);transition:border-color .15s,box-shadow .15s}
.studentchip.active{border-color:var(--accent-strong);box-shadow:0 0 0 1px var(--accent-strong) inset}
.studentchip:hover{border-color:var(--text-3)}
.avatar{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:white;flex:0 0 auto}
.studentchip .name{font-size:12.5px;font-weight:500}
.livepip{width:6px;height:6px;border-radius:50%;background:var(--bad);flex:0 0 auto;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.livepip{animation:none}}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;font-weight:500;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--text-3)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:white}
.btn-primary:hover{opacity:.9;border-color:var(--accent)}
.btn-danger{background:var(--bad);border-color:var(--bad);color:white}
.btn-ghost{border-color:transparent;background:transparent;padding:8px 10px}
.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.icon{width:14px;height:14px;flex:0 0 auto}

.tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--border-soft);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .tab{flex:0 0 auto}
.tab{padding:9px 4px;margin-right:22px;font-size:13.5px;font-weight:500;color:var(--text-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
@media (max-width:480px){ .tab{margin-right:14px;font-size:12.5px} }
.tab.active{color:var(--text);border-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--border-soft);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow-sm)}
.grid2{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}

.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.07em;color:var(--text-3);text-transform:uppercase}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11.5px;font-weight:600;color:var(--text-2)}
.field input,.field select,.field textarea{padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}
.field input[type="range"]{padding:0;accent-color:var(--accent)}
.field textarea{resize:vertical;min-height:52px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent-strong)}
.formrow{display:flex;gap:10px;flex-wrap:wrap}
.formrow>.field{flex:1 1 140px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;letter-spacing:.02em;padding:3px 8px;border-radius:100px}
.emptystate{text-align:center;padding:70px 20px;color:var(--text-2)}
.emptystate h2{font-size:19px;margin-bottom:8px;color:var(--text)}
.emptystate .btn{margin-top:16px}
.emptystate .bigicon{font-size:34px;margin-bottom:6px}

.herocard{background:linear-gradient(160deg, var(--accent-tint), var(--surface) 55%);border-color:color-mix(in oklch, var(--accent-strong) 22%, var(--border-soft))}
.avatarlg{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:white;flex:0 0 auto}

.mistakecard{border-radius:11px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--border-soft);background:var(--surface)}
.mistakecard.flagged{border-color:color-mix(in oklch, var(--warn) 45%, var(--border-soft))}
.mistakecard .row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.mistakecard .txt{font-size:13px;line-height:1.5}
.mistakecard .fix{font-size:12px;color:var(--text-2)}
.count{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:3px 7px;border-radius:100px;background:var(--warn);color:white;white-space:nowrap}
.mini{font-size:11.5px;color:var(--text-3)}
.quietlist{display:flex;flex-direction:column;gap:4px}
.quietrow{display:flex;align-items:center;gap:8px;padding:6px 2px;font-size:12.5px;color:var(--text-2);border-bottom:1px dashed var(--border-soft)}
.quietrow:last-child{border-bottom:none}
.xbtn{margin-left:auto;color:var(--text-3);font-size:15px;line-height:1;flex:0 0 auto}
.xbtn:hover{color:var(--bad)}

.statrow{display:flex;gap:14px;flex-wrap:wrap}
.stat{flex:1 1 120px;background:var(--surface-2);border-radius:11px;padding:12px 14px}
.stat .num{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;line-height:1.1}
.stat .lbl{font-size:11px;color:var(--text-2);margin-top:2px}
.stat-hero{padding:16px 16px}
.stat-hero .num{font-size:30px}
.stat-hero .lbl{font-size:12px}
.deltabadge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:100px}
.delta-up{background:var(--good-tint);color:var(--good)}
.delta-down{background:var(--bad-tint);color:var(--bad)}
.delta-flat{background:var(--surface-2);color:var(--text-2)}
@media (prefers-reduced-motion: no-preference){
  @keyframes fadeSlideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
  @keyframes flamePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}
  @keyframes flipReveal{from{opacity:0;transform:rotateX(90deg)}to{opacity:1;transform:rotateX(0)}}
  .factcard-content{animation:fadeSlideIn .45s cubic-bezier(.2,.7,.3,1)}
  .badgechip{animation:popIn .35s cubic-bezier(.34,1.56,.64,1) backwards}
  .streak-flame{display:inline-block;animation:flamePulse 1.8s ease-in-out infinite}
  .reveal{animation:flipReveal .35s ease}
  .tabfade{animation:fadeSlideIn .3s ease}
  .dashcard:hover{transform:translateY(-2px)}
}
.dashcard{transition:transform .15s ease, box-shadow .15s ease}
.badgechip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:100px;background:var(--surface-2);border:1px solid var(--border-soft);font-size:13px;font-weight:600}
.badgechip.earned{background:var(--gold-tint);color:var(--gold-ink);border-color:color-mix(in oklch, var(--gold) 30%, var(--border-soft))}

.spotlight{
  background: radial-gradient(130% 150% at 100% 0%, oklch(24% 0.1 292) 0%, oklch(19% 0.08 270) 45%, oklch(12% 0.02 260) 100%);
  border: 1px solid oklch(55% 0.1 85 / 0.4);
  border-radius: 20px;
  padding: 28px 30px;
  color: oklch(96% 0.006 80);
  box-shadow: 0 20px 50px oklch(15% 0.02 260 / 0.35);
}
.spotlight .eyebrow{background:oklch(45% 0.09 85 / 0.3);color:oklch(84% 0.1 85)}
.spotlight-headline{font-size:clamp(22px,3vw,30px);font-weight:800;letter-spacing:-0.02em;line-height:1.1;margin:10px 0 4px}
.spotlight-sub{color:oklch(78% 0.015 260);font-size:14px}
.spotlight-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:20px;margin-top:20px;padding-top:20px;border-top:1px solid oklch(55% 0.1 85 / 0.3)}
.spotlight-stat .num{font-size:clamp(26px,3.4vw,36px);font-weight:800;font-family:'IBM Plex Mono',monospace;letter-spacing:-0.02em;color:oklch(96% 0.01 260)}
.spotlight-stat .num.accent{color:oklch(78% 0.12 85)}
.spotlight-stat .lbl{font-size:12px;color:oklch(70% 0.015 260);margin-top:2px}
.glossgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.dashgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.dashcard{cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,box-shadow .15s}
.dashcard:hover{border-color:var(--text-3);box-shadow:var(--shadow-md)}
.dashflags{display:flex;flex-wrap:wrap;gap:6px;min-height:22px}
.glosscard{border:1px solid var(--border-soft);border-radius:11px;padding:12px 13px;display:flex;flex-direction:column;gap:6px}
.glosscard .term{font-size:14px;font-weight:600}
.glosscard .meaning{font-size:12.5px;color:var(--text-2)}
.glosscard .example{font-size:12px;color:var(--text-3);font-style:italic}

.flash{display:flex;flex-direction:column;align-items:center;gap:16px;padding:30px 20px}
.flashcard{width:100%;max-width:420px;min-height:190px;border-radius:16px;border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow-md);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center}
.flashcard .term{font-size:22px;font-weight:700}
.flashcard .reveal{display:flex;flex-direction:column;gap:8px}
.flashcard .meaning{font-size:14px;color:var(--text-2)}
.flashcard .example{font-size:13px;color:var(--text-3);font-style:italic}
.flashcard .tap{font-size:11.5px;color:var(--text-3)}
.flashctrl{display:flex;gap:8px;align-items:center}
.pronbox{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 14px;border-radius:11px;background:var(--surface-2);width:100%;max-width:320px}
.pronrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.recdotsm{width:7px;height:7px;border-radius:50%;background:var(--bad);animation:pulse 1.2s ease-in-out infinite}

.timerbox{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:100px;background:var(--bad-tint)}
.timerbox .dot{width:7px;height:7px;border-radius:50%;background:var(--bad);animation:pulse 1.6s ease-in-out infinite}
.timerbox .t{font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;color:var(--bad)}

.overlay{position:fixed;inset:0;background:oklch(15% 0.01 260 / 0.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;width:100%;max-width:420px;box-shadow:var(--shadow-md);display:flex;flex-direction:column;gap:14px}
.modal h3{font-size:16px}
.modalrow{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);font-size:12.5px;font-weight:500;padding:9px 16px;border-radius:100px;box-shadow:var(--shadow-md);z-index:200}

.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;margin-bottom:12px}
.sectionhead h3{font-size:14px}
.help{font-size:12px;color:var(--text-3);line-height:1.55}
.briefitem{font-size:13.5px;line-height:1.5}
.stack{display:flex;flex-direction:column;gap:14px}
.divider{height:1px;background:var(--border-soft);margin:16px 0}
table.sess{width:100%;border-collapse:collapse;font-size:12.5px}
table.sess th{text-align:left;font-size:10.5px;letter-spacing:.05em;color:var(--text-3);font-weight:600;padding:0 8px 6px 8px;text-transform:uppercase}
table.sess td{padding:7px 8px;border-top:1px solid var(--border-soft);vertical-align:top}
table.sess td.notes{color:var(--text-2);max-width:280px}

@media print{
  body{background:white;color:black}
  .no-print{display:none!important}
  .shell{max-width:100%;padding:0 8px}
  .card{box-shadow:none;border-color:#ccc}
}

.recbtn{background:var(--bad);border-color:var(--bad);color:white}
.recbtn:hover{opacity:.9}
.recbtn.off{background:var(--surface);border-color:var(--border);color:var(--text)}
.recbanner{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:9px;font-size:12.5px;font-weight:600;margin-bottom:10px}
.recbanner .dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:0 0 auto;animation:pulse 1.6s ease-in-out infinite}
.recbanner.live{background:var(--good-tint);color:var(--good)}
.recbanner.stalled{background:var(--bad-tint);color:var(--bad)}
.recbanner.off{background:var(--surface-2);color:var(--text-3);font-weight:500}
.translog{display:flex;flex-direction:column;gap:4px;max-height:280px;overflow-y:auto;margin-top:6px;padding:10px;border-radius:12px;background:linear-gradient(180deg, var(--accent-tint), var(--surface-2) 70%)}
.transline{display:flex;align-items:flex-start;gap:8px;padding:7px 8px;border-radius:8px;border-left:3px solid transparent;font-size:12.5px}
.transline.tag-repair{border-color:var(--warn);background:color-mix(in oklch, var(--warn) 8%, transparent)}
.transline.tag-watch{border-color:var(--accent-strong);background:var(--accent-tint)}
.transline.tag-filler{border-color:var(--border);opacity:.72}
.transline .txt{flex:1 1 auto;line-height:1.5}

let suggestPicks = {};
let libraryQuery = '';
let libraryTypeFilter = 'all';
function computeSuggestions(st){
  const have = new Set(st.glossary.map(g=>norm(g.term)));
  const themes = new Set();
  st.glossary.forEach(g=>{
    const match = PHRASE_LIBRARY.find(p=>norm(p.term)===norm(g.term));
    if(match) themes.add(match.theme);
  });
  const pool = PHRASE_LIBRARY.filter(p=>!have.has(norm(p.term)));
  const themed = themes.size ? pool.filter(p=>themes.has(p.theme)) : [];
  const themedSet = new Set(themed);
  const rest = pool.filter(p=>!themedSet.has(p));
  const ordered = shuffled(themed).concat(shuffled(rest));
  suggestPicks[st.id] = ordered.slice(0,6).map(p=>p.id);
}
function suggestionsFor(st){
  if(!suggestPicks[st.id]) computeSuggestions(st);
  const have = new Set(st.glossary.map(g=>norm(g.term)));
  return suggestPicks[st.id]
    .map(id=>PHRASE_LIBRARY.find(p=>p.id===id))
    .filter(p=>p && !have.has(norm(p.term)));
}
function refreshSuggestions(id){
  const st = state.students.find(s=>s.id===id); if(!st) return;
  computeSuggestions(st);
  render();
}
function addGlossaryFromLibrary(studentId, libId){
  const st = state.students.find(s=>s.id===studentId); if(!st) return;
  const entry = PHRASE_LIBRARY.find(p=>p.id===libId); if(!entry) return;
  addGlossary(st, null, entry.term, entry.type, entry.meaning, entry.example);
  save(); render();
  toast(`Added "${entry.term}" to ${st.name}'s glossary`);
}
function renderSuggestPanel(st){
  const q = norm(libraryQuery);
  const results = q ? PHRASE_LIBRARY.filter(p=>
      (libraryTypeFilter==='all'||p.type===libraryTypeFilter) &&
      (norm(p.term).includes(q) || norm(p.meaning).includes(q) || norm(p.theme).includes(q))
    ).slice(0,20)
    : suggestionsFor(st).filter(p=>libraryTypeFilter==='all'||p.type===libraryTypeFilter);
  return `
  <div class="card no-print">
    <div class="sectionhead">
      <h3>Suggest vocabulary</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <select onchange="libraryTypeFilter=this.value;render()">
          <option value="all" ${libraryTypeFilter==='all'?'selected':''}>All types</option>
          <option value="phrasal" ${libraryTypeFilter==='phrasal'?'selected':''}>Phrasal verbs</option>
          <option value="collocation" ${libraryTypeFilter==='collocation'?'selected':''}>Collocations</option>
          <option value="idiom" ${libraryTypeFilter==='idiom'?'selected':''}>Idioms</option>

        ${!q?`<button class="btn btn-ghost btn-sm" onclick="refreshSuggestions('${st.id}')">Shuffle</button>`:''}
      </div>

    <input type="text" placeholder="Search phrasal verbs, collocations, idioms…" value="${esc(libraryQuery)}" oninput="libraryQuery=this.value;render()" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px">
    ${!q ? `<div class="mini" style="margin-bottom:8px">Based on themes already in ${esc(st.name)}'s glossary — add any of these with one click</div>` : ''}
    ${results.length ? `<div class="stack" style="gap:8px">${results.map(p=>{
      const meta = GTYPES[p.type];
      return `<div class="quietrow" style="align-items:flex-start;gap:10px">
        <span class="pill" style="background:var(${meta.t});color:var(${meta.v});flex:0 0 auto">${meta.label}</span>
        <div style="flex:1">

          <div class="mini">${esc(p.meaning)}</div>

      </div>`;
    }).join('')}</div>` : `<div class="help">${q?'No matches — try a different search.':'No suggestions right now — try shuffling or search the library above.'}</div>`}
  </div>`;
}

function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function jsAttr(s){ return esc(String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")); }
function norm(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,' '); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function avg(arr){ return arr.reduce((a,b)=>a+b,0)/arr.length; }
function fmtDate(ts){ return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
function fmtDateFull(ts){ return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }

/* ---------- recording & heuristic tagging ---------- */
let recognizer = null, recActive = false, recState = 'off', recFailStreak = 0, recRestartTimer = null, recStartedAt = 0;
const COALESCE_WINDOW_MS = 2500; // merge speech-recognition fragments finalized this close together into one line
function speechSupported(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function wordOverlap(a,b){
  const sa = new Set(norm(a).split(' ').filter(Boolean));
  const sb = new Set(norm(b).split(' ').filter(Boolean));
  if(!sa.size || !sb.size) return 0;
  let inter=0; sa.forEach(w=>{ if(sb.has(w)) inter++; });
  return inter/Math.max(sa.size,sb.size);
}
const FILLER_RE = /\b(um+|uh+|erm+|like|you know|i mean|sort of|kind of)\b/i;
const BACKCHANNEL_RE = /^(yeah|yep|yup|okay|ok|alright|all right|right|hmm+|mm+[\s-]?hm+|uh[\s-]?huh|got it|i see|cool|nice|sure|gotcha|great|good|exactly|correct)[.!,?]*$/i;
const HIGH_SIGNAL_TAGS = new Set(['repair','watch']);
function isHighSignal(line){ return line.tags.some(t=>HIGH_SIGNAL_TAGS.has(t)); }
function tagLine(st, text, prevText){
  const tags = [];
  if(FILLER_RE.test(text) || BACKCHANNEL_RE.test(text.trim())) tags.push('filler');
  if(prevText && norm(prevText)!==norm(text) && wordOverlap(prevText,text) >= 0.5) tags.push('repair');
  const watch = st.watchlist||[];
  const lower = text.toLowerCase();
  if(watch.some(w=> w && lower.includes(w.toLowerCase()))) tags.push('watch');
  return tags;
}
function diarizeReady(){ return diarizeSettings.enabled && !!diarizeSettings.nvidiaApiKey; }
function toggleRecording(){
  if(recActive){ diarizeReady() ? stopDiarizedRecording() : stopRecording(); return; }
  const st = activeStudent(); const live = liveMistakeFor(st); if(!live) return;
  if(!diarizeReady() && !speechSupported()){ toast('Speech recognition needs Chrome'); return; }
  if(live.consentConfirmedAt){ diarizeReady() ? startDiarizedRecording() : startRecording(); return; }
  openRecordingConsent();
}
function openRecordingConsent(){
  const st = activeStudent(); if(!st) return;
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Before you record</h3>
      <p class="help">Confirm ${esc(st.name)} knows this session will be recorded for lesson notes. Recording laws vary by location — some places legally require everyone in the conversation to agree, not just you.</p>
      ${st.isMinor ? `<p class="help" style="color:var(--warn);font-weight:600">${esc(st.name)} is marked as a minor — make sure a parent or guardian is aware too.</p>` : ''}
      <div class="modalrow">

        <button class="btn btn-primary" onclick="confirmRecordingConsent()">Yes, they know — start recording</button>
      </div>
    </div>`;
  overlay.id='modalHost';
  document.body.appendChild(overlay);
}
function confirmRecordingConsent(){
  const live = state.liveSession; if(!live) return;
  live.consentConfirmedAt = Date.now();

  closeModal();

}
function startRecording(){
  const st = activeStudent(); const live = liveMistakeFor(st); if(!live) return;
  clearTimeout(recRestartTimer);
  recFailStreak = 0;
  launchRecognizer(st);
  recActive = true;
  recState = 'listening';
  updateRecUI();
}
function launchRecognizer(st){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognizer = new SR();
  recognizer.continuous = true;
  recognizer.interimResults = true;
  recognizer.lang = st.speechLang || guessLangCode(st.lang);
  recognizer.onresult = handleRecResult;
  recognizer.onerror = (e) => {
    if(e.error==='not-allowed' || e.error==='service-not-allowed'){
      toast('Microphone access was blocked — allow it in the browser to record');
      recState = 'off'; recActive = false; recognizer = null; updateRecUI();
      return;
    }
    // 'no-speech' and 'network' are routine and expected during quiet moments — onend handles the restart
  };
  recognizer.onstart = () => { recStartedAt = Date.now(); };
  recognizer.onend = () => {
    if(!recActive) return;
    const livedFor = Date.now() - recStartedAt;
    recFailStreak = livedFor < 1500 ? recFailStreak + 1 : 0;
    if(recFailStreak >= 4){
      recState = 'stalled'; recActive = false;
      updateRecUI();
      return;
    }
    recRestartTimer = setTimeout(() => { if(recActive) launchRecognizer(activeStudentForLiveSession()); }, 350);
  };
  recStartedAt = Date.now();
  try{ recognizer.start(); }catch(e){}
}
function activeStudentForLiveSession(){
  return state.liveSession ? state.students.find(s=>s.id===state.liveSession.studentId) : null;
}
function resumeRecording(){
  const st = activeStudentForLiveSession(); if(!st) return;
  recFailStreak = 0; recState = 'listening'; recActive = true;
  launchRecognizer(st);
  updateRecUI();
}
function stopRecording(){
  recActive = false; recState = 'off';
  clearTimeout(recRestartTimer);
  try{ recognizer && recognizer.stop(); }catch(e){}
  recognizer = null;
  updateRecUI();
}

/* ---------- diarized recording (speaker-separated transcription via NVIDIA Riva) ---------- */
const CALIBRATION_PHRASE = "The quick brown fox jumps over the lazy dog while learning a new language.";
const DIARIZE_CHUNK_MS = 60000;
let diarizeRec = { stage:'idle', stream:null, calibrationBlob:null, calibrationDurationMs:0, mediaRecorder:null, chunkTimer:null };

function startDiarizedRecording(){
  const st = activeStudent(); const live = liveMistakeFor(st); if(!live) return;
  diarizeRec = { stage:'calibrating', stream:null, calibrationBlob:null, calibrationDurationMs:0, mediaRecorder:null, chunkTimer:null };
  recActive = true;
  updateRecUI();
  navigator.mediaDevices.getUserMedia({ audio:true }).then(stream=>{
    if(!recActive){ stream.getTracks().forEach(t=>t.stop()); return; } // user hit Stop before the mic prompt resolved
    diarizeRec.stream = stream;
    recordCalibrationClip();
  }).catch(()=>{
    if(!recActive) return;
    toast('Microphone access was blocked — allow it to record');
    recActive = false; diarizeRec.stage = 'idle'; updateRecUI();
  });
}
function recordCalibrationClip(){
  if(!diarizeRec.stream) return;
  const chunks = [];
  const mr = new MediaRecorder(diarizeRec.stream, { mimeType:'audio/webm;codecs=opus' });
  const startedAt = Date.now();
  mr.ondataavailable = e => { if(e.data.size>0) chunks.push(e.data); };
  mr.onstop = () => {
    diarizeRec.calibrationBlob = new Blob(chunks, { type:'audio/webm' });
    diarizeRec.calibrationDurationMs = Date.now() - startedAt;
    if(!recActive) return; // stopped during calibration
    diarizeRec.stage = 'recording';
    updateRecUI();
    runDiarizeChunk();
  };
  mr.start();
  diarizeRec.mediaRecorder = mr;
  setTimeout(()=>{ if(mr.state!=='inactive'){ try{ mr.stop(); }catch(e){} } }, 4000);
}
function runDiarizeChunk(){
  if(!recActive || !diarizeRec.stream) return;
  const chunks = [];
  const mr = new MediaRecorder(diarizeRec.stream, { mimeType:'audio/webm;codecs=opus' });
  diarizeRec.mediaRecorder = mr;
  mr.ondataavailable = e => { if(e.data.size>0) chunks.push(e.data); };
  mr.onstop = () => {
    const blob = new Blob(chunks, { type:'audio/webm' });
    if(recActive) runDiarizeChunk(); // keep capturing immediately; upload happens alongside
    if(blob.size > 500) uploadDiarizeChunk(blob);
  };
  mr.start();
  diarizeRec.chunkTimer = setTimeout(()=>{ if(mr.state!=='inactive'){ try{ mr.stop(); }catch(e){} } }, DIARIZE_CHUNK_MS);
}
async function uploadDiarizeChunk(blob){
  const st = activeStudentForLiveSession(); const live = state.liveSession;
  if(!st || !live || !diarizeRec.calibrationBlob) return;
  const form = new FormData();
  form.append('calibration', diarizeRec.calibrationBlob, 'calibration.webm');
  form.append('chunk', blob, 'chunk.webm');
  try{
    const resp = await fetch(DIARIZE_PROXY_URL, {
      method:'POST',
      headers:{
        'X-Nvidia-Api-Key': diarizeSettings.nvidiaApiKey,
        'X-Max-Speakers': String(diarizeSettings.maxSpeakers||2),
        'X-Calibration-Duration-Ms': String(diarizeRec.calibrationDurationMs),
      },
      body: form,
    });
    if(!resp.ok){
      const err = await resp.json().catch(()=>({}));
      toast('Speaker separation hiccup: ' + (err.error || resp.status) + ' — still recording');
      return;
    }
    const data = await resp.json();
    for(const seg of (data.segments||[])){
      if(seg.text && seg.text.trim()) pushTranscriptLine(st, live, seg.text.trim(), seg.role);
    }
  }catch(e){
    toast('Could not reach the speaker-separation service — still recording, will retry next chunk');
  }
}
function stopDiarizedRecording(){
  recActive = false;
  clearTimeout(diarizeRec.chunkTimer);
  try{ diarizeRec.mediaRecorder && diarizeRec.mediaRecorder.state!=='inactive' && diarizeRec.mediaRecorder.stop(); }catch(e){}
  try{ diarizeRec.stream && diarizeRec.stream.getTracks().forEach(t=>t.stop()); }catch(e){}
  diarizeRec = { stage:'idle', stream:null, calibrationBlob:null, calibrationDurationMs:0, mediaRecorder:null, chunkTimer:null };
  updateRecUI();
}

function updateRecUI(){
  const btn = document.getElementById('recToggleBtn');
  if(btn){ btn.textContent = recActive ? 'Stop recording' : 'Start recording'; btn.classList.toggle('recbtn', recActive); btn.classList.toggle('off', !recActive); }
  const banner = document.getElementById('recBanner');
  if(banner){
    if(diarizeReady()){
      if(diarizeRec.stage==='calibrating') banner.outerHTML = `<div id="recBanner" class="recbanner live"><span class="dot"></span>Calibrating — please read aloud: "${esc(CALIBRATION_PHRASE)}"</div>`;
      else if(diarizeRec.stage==='recording') banner.outerHTML = `<div id="recBanner" class="recbanner live"><span class="dot"></span>Recording — speaker-separated</div>`;
      else banner.outerHTML = `<div id="recBanner" class="recbanner off">Not recording</div>`;
    }
    else if(recState==='listening') banner.outerHTML = `<div id="recBanner" class="recbanner live"><span class="dot"></span>Recording — listening</div>`;
    else if(recState==='stalled') banner.outerHTML = `<div id="recBanner" class="recbanner stalled">Recording stopped unexpectedly<button class="btn btn-sm" style="margin-left:auto" onclick="resumeRecording()">Resume</button></div>`;
    else banner.outerHTML = `<div id="recBanner" class="recbanner off">Not recording</div>`;
  }
}
function handleRecResult(e){
  const live = state.liveSession; if(!live) return;
  const st = state.students.find(s=>s.id===live.studentId); if(!st) return;
  recFailStreak = 0;
  let interim = '';
  for(let i=e.resultIndex;i<e.results.length;i++){
    const res = e.results[i];
    const text = res[0].transcript.trim();
    if(res.isFinal){ if(text) appendOrPushLine(st, live, text); }
    else interim += text;
  }
  if(activeStudent()?.id !== st.id) return;
  const interimEl = document.getElementById('interimLine');
  if(interimEl) interimEl.textContent = interim;
}
function appendOrPushLine(st, live, text){
  // Speech recognition (especially on mobile) often finalizes a single sentence as several
  // separate fragments in quick succession. Merge fragments landing close together into the
  // same line instead of showing a run of choppy near-duplicate statements. Never merges into a
  // diarized line (role set) — those are already coherent, speaker-attributed segments.
  const last = live.transcript[live.transcript.length-1];
  const now = Date.now() - live.startedAt;
  if(last && !last.role && !last.done && (now - last.t) < COALESCE_WINDOW_MS){
    const prev = live.transcript[live.transcript.length-2];
    last.text = (last.text + ' ' + text).trim();
    last.tags = tagLine(st, last.text, prev?prev.text:null);
    save();
    const el = document.querySelector(`[data-line="${last.id}"]`);
    if(el) el.outerHTML = transcriptLineHTML(live.sessionId, last);
    return;
  }
  pushTranscriptLine(st, live, text);
}
function pushTranscriptLine(st, live, text, role){
  const prev = live.transcript[live.transcript.length-1];
  // Diarization already told us who's speaking — never flag the tutor's own lines as mistakes.
  const tags = role==='tutor' ? [] : tagLine(st, text, prev?prev.text:null);
  const line = { id:uid(), t: Date.now()-live.startedAt, text, tags, done:false, role: role||null };
  live.transcript.push(line);
  save();
  const log = document.getElementById('transcriptLog');
  if(log && (transcriptShowAll || isHighSignal(line) || role)){
    log.insertAdjacentHTML('beforeend', transcriptLineHTML(live.sessionId, line));
    log.scrollTop = log.scrollHeight;
  }
  const hiddenEl = document.getElementById('hiddenCount');
  if(hiddenEl && !transcriptShowAll){
    hiddenEl.textContent = live.transcript.filter(l=>!l.done && !isHighSignal(l) && !l.role).length;
  }
}
function transcriptLineHTML(sessionId, line){
  const tagLabel = line.tags.includes('watch') ? TAGMETA.watch.label : line.tags.includes('repair') ? TAGMETA.repair.label : line.tags.includes('filler') ? TAGMETA.filler.label : '';
  const cls = line.tags.includes('watch') ? 'tag-watch' : line.tags.includes('repair') ? 'tag-repair' : line.tags.includes('filler') ? 'tag-filler' : '';
  const roleLabel = line.role==='tutor' ? `<span class="mini mono" style="opacity:.65">You</span> ` : line.role==='student' ? `<span class="mini mono" style="opacity:.65">Student</span> ` : '';
  return `<div class="transline ${cls}" data-line="${line.id}">
    <div class="txt">${roleLabel}${tagLabel?`<span class="tagpill">${tagLabel}</span>`:''}${esc(line.text)}</div>
    <div class="acts no-print">
      <button class="linkbtn" onclick="openTagAsMistake('${sessionId}','${line.id}')">+ mistake</button>
      <button class="linkbtn" onclick="openTagAsVocab('${sessionId}','${line.id}')">+ vocab</button>
      <button class="linkbtn muted" onclick="dismissLine('${sessionId}','${line.id}')">dismiss</button>
    </div>
  </div>`;
}
function findLine(sessionId, lineId){
  const st = activeStudent(); if(!st) return null;
  const t = transcriptFor(st, sessionId); if(!t) return null;
  return t.find(l=>l.id===lineId) || null;
}
function dismissLine(sessionId, lineId){
  const line = findLine(sessionId, lineId); if(!line) return;
  line.done = true; save();
  document.querySelector(`[data-line="${lineId}"]`)?.remove();
}
function openTagAsMistake(sessionId, lineId){

      <div class="field"><label>Correction (optional)</label><input id="tmFix" placeholder="How it should be said"></div>
      <div class="field"><label>Category</label>
        <select id="tmCat">${Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}</select>
      </div>
      <div class="modalrow">

      </div>
    </div>`;

  document.body.appendChild(overlay);
}
function confirmTagAsMistake(sessionId, lineId){
  const st = activeStudent(); if(!st) return;

function openTagAsVocab(sessionId, lineId){
  const line = findLine(sessionId, lineId); if(!line) return;
  const overlay = document.createElement('div');
  overlay.className = 'overlay';

function addTopicRequest(){

function addMistake(st, sessionId, text, correction, category){
  if(!text) return null;
  const key = category+'|'+norm(text);
  let m = st.mistakes.find(x=> (x.category+'|'+norm(x.text))===key );
  if(m){
    if(correction && !m.correction) m.correction = correction;
    m.occurrences.push({sessionId, date: Date.now()});
  } else {
    m = { id:uid(), category, text, correction, occurrences:[{sessionId, date: Date.now()}] };
    st.mistakes.push(m);
  }
  return m;
}
function addGlossary(st, sessionId, term, type, meaning, example){
  if(!term) return null;
  const key = type+'|'+norm(term);
  let g = st.glossary.find(x=> (x.type+'|'+norm(x.term))===key );
  if(g){
    if(meaning) g.meaning = meaning;
    if(example) g.example = example;
    g.occurrences.push({sessionId, date: Date.now()});
  } else {
    g = { id:uid(), type, term, meaning, example, occurrences:[{sessionId, date: Date.now()}] };
    st.glossary.push(g);
  }
  return g;
}

function sessionStats(st, sessionId){
  const flagged = st.mistakes.filter(m => m.occurrences.some(o=>o.sessionId===sessionId) && m.occurrences.length>1);
  const firstTime = st.mistakes.filter(m => m.occurrences.some(o=>o.sessionId===sessionId) && m.occurrences.length===1);
  const vocab = st.glossary.filter(g => g.occurrences.some(o=>o.sessionId===sessionId));
  return { flagged, firstTime, vocab };
}
function autoScore(st, sessionId){
  const {flagged, firstTime, vocab} = sessionStats(st, sessionId);
  return clamp(Math.round(100 - flagged.length*9 - firstTime.length*2 + Math.min(vocab.length,5)), 0, 100);
}

function tickTimer(){

/* ---------- progression math ---------- */
function progression(st){
  const ratings = st.sessions.map(s=>s.rating);
  const cum = ratings.map((_,i)=> avg(ratings.slice(0,i+1)));
  const n = ratings.length;
  const prevAvg = n>=2 ? avg(ratings.slice(0,n-1)) : null;
  const delta = (n>=2) ? Math.round(ratings[n-1]-prevAvg) : null;
  return { ratings, cum, current: n? Math.round(cum[n-1]) : null, delta };
}

/* ---------- charts ---------- */
function chartSVG(st, H=170, dark=false){
  const { ratings, cum } = progression(st);
  const n = ratings.length;
  if(n===0) return '<div class="help" style="padding:30px 0;text-align:center">No sessions yet — the progression chart fills in after your first saved session.</div>';
  const W=640,padL=30,padR=10,padT=10,padB=22;
  const xStep = n>1 ? (W-padL-padR)/(n-1) : 0;
  const xFor = i => padL + i*xStep;
  const yFor = v => padT + (100-v)/100*(H-padT-padB);
  const linePts = ratings.map((v,i)=> xFor(i)+','+yFor(v)).join(' ');
  const cumPts = cum.map((v,i)=> xFor(i)+','+yFor(v)).join(' ');
  const areaPts = cumPts + ' ' + xFor(n-1)+','+(H-padB) + ' ' + xFor(0)+','+(H-padB);
  const gridStroke = dark ? 'oklch(40% 0.02 260)' : 'var(--border-soft)';
  const labelFill = dark ? 'oklch(72% 0.015 260)' : 'var(--text-3)';
  const accentStroke = dark ? 'oklch(75% 0.11 270)' : 'var(--accent)';
  const areaFill = dark ? 'oklch(40% 0.09 270)' : 'var(--accent-tint)';
  const dashedStroke = dark ? 'oklch(55% 0.02 260)' : 'var(--text-3)';
  let grid = '';
  [0,25,50,75,100].forEach(v=>{
    const y = yFor(v);
    grid += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="${gridStroke}" stroke-width="1"/>`;
    grid += `<text x="${padL-6}" y="${y+3}" text-anchor="end" font-size="9" fill="${labelFill}" font-family="IBM Plex Mono, monospace">${v}</text>`;
  });
  const dots = ratings.map((v,i)=> `<circle cx="${xFor(i)}" cy="${yFor(v)}" r="${i===n-1?4:2.5}" fill="${accentStroke}"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H+16}" width="100%" style="overflow:visible">
    ${grid}
    <polygon points="${areaPts}" fill="${areaFill}" opacity="${dark?0.55:0.7}"/>
    <polyline points="${cumPts}" fill="none" stroke="${accentStroke}" stroke-width="2" stroke-linejoin="round"/>
    <polyline points="${linePts}" fill="none" stroke="${dashedStroke}" stroke-width="1.3" stroke-dasharray="2 3"/>
    ${dots}
    <text x="${padL}" y="${H+13}" font-size="9.5" fill="${labelFill}">${esc(fmtDate(st.sessions[0].date))}</text>
    <text x="${W-padR}" y="${H+13}" text-anchor="end" font-size="9.5" fill="${labelFill}">${esc(fmtDate(st.sessions[n-1].date))}</text>
  </svg>`;
}

  return st.sessions.reduce((sum,sess)=> sum + (sess.transcript||[]).filter(l=>!l.done && l.tags.length).length, 0);

function studentNeedsAttentionCount(st){
  return st.mistakes.filter(m=>m.occurrences.length>1).length;

function crossStudentInsights(){
  const byCat = {};
  state.students.forEach(st=>{
    const cats = new Set();
    st.mistakes.filter(m=>m.occurrences.length>1).forEach(m=>cats.add(m.category));
    cats.forEach(c=>{ byCat[c] = byCat[c] || new Set(); byCat[c].add(st.id); });
  });
  return Object.entries(byCat)
    .filter(([,ids])=>ids.size>=2)
    .map(([cat,ids])=>({cat, count:ids.size}))
    .sort((a,b)=>b.count-a.count);
}
function buildCrossStudentContext(insights){
  const lines = [`Teaching prep — patterns across ${state.students.length} students`, ''];
  insights.forEach(i=>{
    const c = CATS[i.cat];
    lines.push(`- ${c?c.label:i.cat}: ${i.count} of ${state.students.length} students have a recurring issue here`);
  });
  lines.push('');
  lines.push('Use this to suggest a general lesson activity or worksheet that would help with these shared problem areas.');
  return lines.join('\n');
}

const DRILL_TEMPLATES = {
  grammar: (name, m) => [
    `Ask ${name} to say the corrected form three times in new sentences: "${m.correction||m.text}"`,
    `Read back the mistake and have ${name} fix it on the spot: "${m.text}"`,
    `Say both forms aloud — "${m.text}" and "${m.correction||m.text}" — and ask ${name} which is correct and why.`,
  ],
  vocab: (name, m) => [
    `Ask ${name} for another way to say "${m.text}".`,
    `Have ${name} use "${m.correction||m.text}" in a brand new sentence about their day.`,
    `Give ${name} a short context and ask them to pick the better word choice between "${m.text}" and "${m.correction||m.text}".`,
  ],
  pron: (name, m) => [
    `Isolate the word and have ${name} repeat it three times, exaggerating the correct sound.`,
    `Find a word that rhymes with the correct pronunciation of "${m.correction||m.text}" and drill both together.`,
    `Ask ${name} to say "${m.correction||m.text}" slowly, then at normal speed, twice each.`,
  ],
  usage: (name, m) => [
    `Quick role-play: give ${name} a scenario where they must use "${m.correction||m.text}" naturally.`,
    `Ask ${name} to explain, in their own words, when they'd use "${m.correction||m.text}" instead of "${m.text}".`,
    `Have ${name} say one new sentence using "${m.correction||m.text}" correctly.`,
  ],
};
const VOCAB_DRILL_TEMPLATES = {
  vocabulary: (name, g) => [
    `Ask ${name} to define "${g.term}" in their own words, then use it in a sentence.`,
    `Give ${name} a quick scenario and have them work "${g.term}" into their response.`,
    `Ask ${name} for a synonym of "${g.term}" — then check it actually fits.`,
  ],
  phrasal: (name, g) => [
    `Give ${name} a situation and have them respond using the phrasal verb "${g.term}".`,
    `Ask ${name} to swap "${g.term}" for a single-word synonym, then explain the difference in tone.`,
  ],
  collocation: (name, g) => [
    `Prompt: "Finish this sentence using '${g.term}'..." and let ${name} complete it out loud.`,
    `Ask ${name} what other word commonly pairs with part of "${g.term}".`,
  ],
  idiom: (name, g) => [
    `Ask ${name} to guess the literal vs. actual meaning of "${g.term}", then use it correctly in a sentence.`,
    `Give ${name} a short scenario and have them find a moment where "${g.term}" fits.`,
  ],
};
function pickDrill(list){ return list[Math.floor(Math.random()*list.length)]; }
let quickDrills = {};
function showQuickDrill(kind, itemId){
  const st = activeStudent(); if(!st) return;
  let text;
  if(kind==='mistake'){
    const m = st.mistakes.find(x=>x.id===itemId); if(!m) return;
    const templates = DRILL_TEMPLATES[m.category] || DRILL_TEMPLATES.usage;
    text = pickDrill(templates(st.name, m));
  } else {
    const g = st.glossary.find(x=>x.id===itemId); if(!g) return;
    const templates = VOCAB_DRILL_TEMPLATES[g.type] || VOCAB_DRILL_TEMPLATES.vocabulary;
    text = pickDrill(templates(st.name, g));
  }
  quickDrills[kind+':'+itemId] = text;
  render();
}
function copyQuickDrill(kind, itemId){
  const text = quickDrills[kind+':'+itemId];
  if(!text) return;
  copyText(text, 'Drill copied');
}
function drillBlockHTML(kind, itemId){
  const text = quickDrills[kind+':'+itemId];
  if(!text) return `<button class="btn btn-ghost btn-sm no-print" style="margin-top:6px" onclick="showQuickDrill('${kind}','${itemId}')">🎲 Quick drill</button>`;
  return `<div class="mini" style="margin-top:6px;padding:8px;border-radius:8px;background:var(--surface-2)">🎲 ${esc(text)}</div>
    <div class="no-print" style="display:flex;gap:10px;margin-top:4px">
      <button class="linkbtn" onclick="copyQuickDrill('${kind}','${itemId}')">Copy</button>
      <button class="linkbtn muted" onclick="showQuickDrill('${kind}','${itemId}')">Another</button>
    </div>`;
}

/* ---------- transcript review (after the fact) ---------- */
function openReview(sessionId){ reviewSessionId = sessionId; render(); }
let recImportSessionId = null;
function importRecordingForSession(sessionId){
  recImportSessionId = sessionId;
  document.getElementById('recImportFile').click();
}
function handleRecordingImport(file){
  if(!file) return;
  const sessionId = recImportSessionId;
  const st = activeStudent();
  const sess = st && st.sessions.find(s=>s.id===sessionId);
  if(!st || !sess){ toast("Couldn't tell which session that was for — try clicking Import recording again"); document.getElementById('recImportFile').value=''; return; }
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try{ data = JSON.parse(reader.result); }catch(e){ toast('That file is not valid JSON'); return; }
    const lines = Array.isArray(data.transcript) ? data.transcript : null;
    if(!lines || !lines.length){ toast("Couldn't find a recording in that file"); return; }
    if(!confirm("Replace this session's transcript with your student's recording? Mistakes and vocabulary you've already logged stay untouched — only the raw transcript left to review changes.")) return;
    let prev = null;
    sess.transcript = lines.map(l=>{
      const tags = tagLine(st, l.text, prev); prev = l.text;
      return { id:uid(), t:l.t||0, text:l.text, tags, done:false };
    });
    save(); render();
    toast("Swapped in your student's recording — ready to review");
  };
  reader.readAsText(file);
  document.getElementById('recImportFile').value='';
}

/* ---------- spaced repetition ---------- */
const SRS_INTERVALS_DAYS = [0, 1, 3, 7, 14, 30, 60];
function srsOf(g){ return g.srs || (g.srs = { box:0, nextReview:0, lastReviewed:null }); }
function srsGrade(g, gotIt){
  const s = srsOf(g);
  s.box = gotIt ? Math.min(s.box+1, SRS_INTERVALS_DAYS.length-1) : 0;
  s.lastReviewed = Date.now();
  s.nextReview = Date.now() + SRS_INTERVALS_DAYS[s.box]*86400000;
}
function srsDueCount(st){ const now=Date.now(); return st.glossary.filter(g=>srsOf(g).nextReview<=now).length; }
function srsMasteredCount(st){ return st.glossary.filter(g=>srsOf(g).box>=4).length; }
function currentPracticeStudent(){ return STUDENT_MODE ? studentState.student : activeStudent(); }

/* ---------- practice streaks ---------- */
function bumpStreak(st){
  st.streak = st.streak || { current:0, longest:0, lastDate:null };
  const today = new Date().toDateString();
  if(st.streak.lastDate === today) return;
  const yesterday = new Date(Date.now()-86400000).toDateString();
  st.streak.current = (st.streak.lastDate === yesterday) ? st.streak.current+1 : 1;
  st.streak.longest = Math.max(st.streak.longest, st.streak.current);
  st.streak.lastDate = today;
}
function streakIsLive(st){
  if(!st.streak || !st.streak.current) return false;
  const today = new Date().toDateString();
  const yesterday = new Date(Date.now()-86400000).toDateString();
  return st.streak.lastDate===today || st.streak.lastDate===yesterday;
}
function streakAtRisk(st){
  if(!st.streak || !st.streak.current) return false;
  const yesterday = new Date(Date.now()-86400000).toDateString();
  return st.streak.lastDate === yesterday;
}

/* ---------- pronunciation ---------- */
function speakTerm(text, lang){
  if(!window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang || 'en-US';
    speechSynthesis.speak(u);
  }catch(e){}
}
function shuffled(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---------- self-recording pronunciation practice (ephemeral, never saved or sent) ---------- */
let pronRecorder = null, pronChunks = [], pronBlobUrl = null, pronRecording = false;
function micRecordingSupported(){ return !!(navigator.mediaDevices && window.MediaRecorder); }
function resetPronRecording(){
  if(pronRecorder && pronRecording){ try{ pronRecorder.stop(); }catch(e){} }
  if(pronBlobUrl){ URL.revokeObjectURL(pronBlobUrl); pronBlobUrl = null; }
  pronRecorder = null; pronChunks = []; pronRecording = false;
}
async function togglePronRecording(){
  if(pronRecording){ try{ pronRecorder.stop(); }catch(e){} return; }
  if(!micRecordingSupported()){ toast('Recording your own voice needs a modern browser'); return; }
  if(pronBlobUrl){ URL.revokeObjectURL(pronBlobUrl); pronBlobUrl = null; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    pronChunks = [];
    pronRecorder = new MediaRecorder(stream);
    pronRecorder.ondataavailable = e => { if(e.data.size>0) pronChunks.push(e.data); };
    pronRecorder.onstop = () => {
      stream.getTracks().forEach(t=>t.stop());
      const blob = new Blob(pronChunks, { type:'audio/webm' });
      pronBlobUrl = blob.size ? URL.createObjectURL(blob) : null;
      pronRecording = false;
      render();
    };
    pronRecorder.start();
    pronRecording = true;
    render();
  }catch(e){
    toast('Microphone access was blocked — allow it to record yourself');
  }
}
function playPronRecording(){ if(pronBlobUrl) new Audio(pronBlobUrl).play().catch(()=>{}); }

function startPractice(id){

function startPracticeFor(st){
  if(!st || !st.glossary.length) return;
  practice = { active:true, queue:[], pos:0, revealed:false, typedAnswer:'', typeFilter:'all', pool:'due', finished:false, stats:{right:0,wrong:0} };
  rebuildPracticeQueue();
  render();
}
function rebuildPracticeQueue(){
  const st = currentPracticeStudent(); if(!st) return;
  const filtered = practice.typeFilter==='all' ? st.glossary : st.glossary.filter(g=>g.type===practice.typeFilter);
  const now = Date.now();
  const items = practice.pool==='due' ? filtered.filter(g=>srsOf(g).nextReview<=now) : filtered;
  practice.queue = shuffled(items.map(g=>g.id));
  practice.pos = 0;
  practice.revealed = false;
  practice.typedAnswer = '';
  resetPronRecording();
}
function practiceSetFilter(val){ practice.typeFilter=val; practice.pool='due'; practice.finished=false; rebuildPracticeQueue(); render(); }
function practicePracticeAnyway(){ practice.pool='all'; practice.finished=false; practice.stats={right:0,wrong:0}; rebuildPracticeQueue(); render(); }
function practiceReveal(){
  const el = document.getElementById('practiceTyped');
  practice.typedAnswer = el ? el.value.trim() : '';
  practice.revealed = true;
  render();
}
function practiceGrade(gotIt){
  const st = currentPracticeStudent(); if(!st) return;
  const g = st.glossary.find(x=>x.id===practice.queue[practice.pos]);
  if(g){ srsGrade(g, gotIt); practice.stats[gotIt?'right':'wrong']++; }
  bumpStreak(st);
  if(STUDENT_MODE) saveStudentState(); else save();
  practice.pos++;
  practice.revealed = false;
  practice.typedAnswer = '';
  resetPronRecording();
  if(practice.pos >= practice.queue.length) practice.finished = true;
  render();
}

/* ---------- import / export ---------- */
function downloadFile(filename, data, mime){
  if(window.claude?.downloads){
    return window.claude.downloads.save({ filename, data })
      .then(()=>toast('Saved '+filename))
      .catch(err=>toast(err?.code==='declined' ? 'Save cancelled' : 'Could not save the file'));
  }
  try{
    const blob = new Blob([data], { type: mime||'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    toast('Saved '+filename);
  }catch(e){
    toast('Could not save the file');
  }
}
function slugify(name){ return String(name).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }
function exportStudent(id){
  const st = state.students.find(s=>s.id===id); if(!st) return;
  const data = JSON.stringify({ kind:'lesson-copilot-student', exportedAt: Date.now(), student: st }, null, 2);
  downloadFile(slugify(st.name)+'-lesson-file.json', data);
}
function exportAll(){
  const data = JSON.stringify({ kind:'lesson-copilot-backup', exportedAt: Date.now(), state }, null, 2);
  downloadFile('lesson-copilot-backup.json', data);
  localStorage.setItem('chattercheck_last_backup_v1', String(Date.now()));
}
const BACKUP_REMINDER_DAYS = 14;
function daysSinceLastBackup(){
  const raw = localStorage.getItem('chattercheck_last_backup_v1');
  if(!raw) return Infinity;
  return (Date.now() - Number(raw)) / 86400000;
}
function totalSessionsLogged(){
  return state.students.reduce((sum,s)=>sum+s.sessions.length, 0);
}
function dismissBackupReminder(){
  sessionStorage.setItem('chattercheck_backup_reminder_dismissed', '1');
  document.getElementById('backupReminder')?.remove();
}
function shouldShowBackupReminder(){
  if(sessionStorage.getItem('chattercheck_backup_reminder_dismissed')) return false;
  if(totalSessionsLogged() < 1) return false;
  return daysSinceLastBackup() > BACKUP_REMINDER_DAYS;
}
function normalizeStudent(s){
  // A hand-edited, corrupted, or older-format file could be missing any of these fields.
  // Fill in safe defaults so an import can never crash the page — for a student importing
  // their own file, there's no way to recover from a blank/broken screen on their own.
  const copy = JSON.parse(JSON.stringify(s || {}));
  copy.name = (typeof copy.name==='string' && copy.name.trim()) ? copy.name.trim() : 'Unnamed student';
  copy.lang = (typeof copy.lang==='string' && copy.lang.trim()) ? copy.lang.trim() : 'General';
  copy.level = copy.level || 'B1';
  copy.color = copy.color || colorFor(copy.name);
  copy.isMinor = !!copy.isMinor;
  copy.sessions = Array.isArray(copy.sessions) ? copy.sessions : [];
  copy.mistakes = Array.isArray(copy.mistakes) ? copy.mistakes : [];
  copy.glossary = Array.isArray(copy.glossary) ? copy.glossary : [];
  copy.watchlist = Array.isArray(copy.watchlist) ? copy.watchlist : [];
  copy.topicRequests = Array.isArray(copy.topicRequests) ? copy.topicRequests : [];
  copy.sessions.forEach(sess=>{ if(!Array.isArray(sess.transcript)) sess.transcript = []; });
  copy.mistakes.forEach(m=>{ if(!Array.isArray(m.occurrences)) m.occurrences = []; });
  copy.glossary.forEach(g=>{ if(!Array.isArray(g.occurrences)) g.occurrences = []; });
  return copy;
}
function extractStudents(data){
  if(data.kind==='lesson-copilot-student' && data.student) return [data.student];
  if(data.kind==='lesson-copilot-backup' && data.state?.students) return data.state.students;
  if(data.student) return [data.student];
  if(Array.isArray(data.students)) return data.students;
  if(data.id && Array.isArray(data.sessions)) return [data];
  return [];
}
function copyText(text, successMsg){
  const done = () => toast(successMsg);
  const fail = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('Could not copy — select the text and copy it manually'); }
    ta.remove();
  };
  if(navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(done).catch(fail);
  else fail();
}
function copyStudentLink(){
  const url = location.origin + location.pathname + '?student=1';
  copyText(url, 'Student link copied');
}
function buildLessonContext(st){
  const prog = progression(st);
  const needsAttention = st.mistakes.filter(m=>m.occurrences.length>1).sort((a,b)=>b.occurrences.length-a.occurrences.length);
  const dueVocab = st.glossary.filter(g=>srsOf(g).nextReview<=Date.now());
  const lastSession = st.sessions[st.sessions.length-1];
  const lines = [];
  lines.push(`Lesson context for ${st.name} — ${st.lang}, level ${st.level}`);
  lines.push(`${st.sessions.length} session${st.sessions.length===1?'':'s'} logged${prog.current!==null?`, current average ${prog.current}%`:''}.`);
  if(needsAttention.length){
    lines.push('');
    lines.push('Recurring mistakes to address:');
    needsAttention.forEach(m=>{
      const c = CATS[m.category];
      lines.push(`- "${m.text}"${m.correction?` → ${m.correction}`:''} (${c?c.label:m.category}, seen ${m.occurrences.length}×)`);
    });
  }
  if(dueVocab.length){
    lines.push('');
    lines.push('Vocabulary due for review:');
    dueVocab.forEach(g=>{ lines.push(`- ${g.term}${g.meaning?`: ${g.meaning}`:''}`); });
  }
  if(st.watchlist && st.watchlist.length){
    lines.push('');
    lines.push(`Currently watching for: ${st.watchlist.join(', ')}`);
  }
  if(st.topicRequests && st.topicRequests.length){
    lines.push('');
    lines.push(`${st.name} asked to cover: ${st.topicRequests.join(', ')}`);
  }
  if(lastSession){
    lines.push('');
    lines.push(`Last session (${fmtDateFull(lastSession.date)}): ${lastSession.notes || 'no notes recorded'}`);
  }
  lines.push('');
  lines.push(`Use this to help me prepare practice materials, explanations, or exercises for ${st.name}'s next lesson.`);
  return lines.join('\n');
}
function copyLessonContext(studentId){
  const st = state.students.find(s=>s.id===studentId);
  if(!st) return;
  copyText(buildLessonContext(st), `${st.name}'s lesson context copied — paste it into Claude`);
}
function handleStudentImport(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try{ data = JSON.parse(reader.result); }catch(e){ toast('That file is not valid JSON'); return; }
    const incoming = extractStudents(data)[0];
    if(!incoming){ toast("Couldn't find your lesson file in there"); return; }
    studentState.student = normalizeStudent(incoming);
    saveStudentState();
    practice.active = false;
    render();
    toast('Loaded ' + (incoming.name || 'your file'));
  };
  reader.readAsText(file);
  document.getElementById('studentImportFile').value='';
}
function handleImport(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try{ data = JSON.parse(reader.result); }catch(e){ toast('That file is not valid JSON'); return; }
    const incoming = extractStudents(data);
    if(!incoming.length){ toast("Couldn't find a student record in that file"); return; }
    const imported = incoming.map(s=>{
      const copy = normalizeStudent(s);
      copy.id = uid();
      state.students.push(copy);
      state.activeStudentId = copy.id;
      return copy;
    });
    save(); view='file'; render();
    toast(imported.length>1 ? `Imported ${imported.length} students` : `Imported ${imported[0].name}`);
  };
  reader.readAsText(file);
  document.getElementById('importFile').value='';
}

  const cats = [
    { icon:'🔥', suffix:'day streak', val: (st.streak&&st.streak.longest)||0, steps:[3,7,14,30,60,100] },

let srec = null, srecActive = false, srecState = 'off', srecFailStreak = 0, srecRestartTimer = null, srecStartedAt = 0;
function srecLangCode(){
  const st = studentState.student;
  return (st && (st.speechLang || guessLangCode(st.lang))) || 'en-US';

function openStudentRecordingConsent(){

  overlay.id='modalHost';
  document.body.appendChild(overlay);
}
function confirmStudentRecordingConsent(){
  studentRecording.consentConfirmedAt = Date.now();
  saveStudentRecording();
  closeModal();
  startStudentRecording();
}
function startStudentRecording(){
  clearTimeout(srecRestartTimer);
  srecFailStreak = 0;
  if(!studentRecording.startedAt){ studentRecording.startedAt = Date.now(); saveStudentRecording(); }
  launchSRec();
  srecActive = true; srecState = 'listening';
  updateSRecUI();
}
function launchSRec(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  srec = new SR();
  srec.continuous = true;
  srec.interimResults = true;
  srec.lang = srecLangCode();
  srec.onresult = (e) => {
    srecFailStreak = 0;
    let interim = '';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const res = e.results[i];
      const text = res[0].transcript.trim();
      if(res.isFinal){
        if(text){
          const now = Date.now();
          const last = studentRecording.transcript[studentRecording.transcript.length-1];
          // Mobile speech recognition tends to finalize far more often than desktop — a single
          // sentence can arrive as several separate "final" fragments. Merge fragments that land
          // close together in time into one line instead of showing them as separate statements.
          if(last && (now - studentRecording.startedAt - last.t) < COALESCE_WINDOW_MS){
            last.text = (last.text + ' ' + text).trim();
            saveStudentRecording();
            const log = document.getElementById('srecLog');
            if(log && log.lastElementChild) log.lastElementChild.textContent = last.text;
          } else {
            studentRecording.transcript.push({ t: now-studentRecording.startedAt, text });
            saveStudentRecording();
            const log = document.getElementById('srecLog');
            if(log){ log.insertAdjacentHTML('beforeend', `<div class="transline">${esc(text)}</div>`); log.scrollTop = log.scrollHeight; }
          }
        }
      } else interim += text;
    }
    const el = document.getElementById('srecInterim');
    if(el) el.textContent = interim;
  };
  srec.onerror = (e) => {
    if(e.error==='not-allowed' || e.error==='service-not-allowed'){
      toast('Microphone access was blocked — allow it in the browser to record');
      srecState='off'; srecActive=false; srec=null; updateSRecUI();
    }
  };
  srec.onstart = () => { srecStartedAt = Date.now(); };
  srec.onend = () => {
    if(!srecActive) return;
    const livedFor = Date.now() - srecStartedAt;
    srecFailStreak = livedFor < 1500 ? srecFailStreak + 1 : 0;
    if(srecFailStreak >= 4){ srecState = 'stalled'; srecActive = false; updateSRecUI(); return; }
    srecRestartTimer = setTimeout(()=>{ if(srecActive) launchSRec(); }, 350);
  };
  srecStartedAt = Date.now();
  try{ srec.start(); }catch(e){}
}
function resumeStudentRecording(){
  srecFailStreak = 0; srecState = 'listening'; srecActive = true;
  launchSRec(); updateSRecUI();
}
function stopStudentRecording(){
  srecActive = false; srecState = 'off';
  clearTimeout(srecRestartTimer);
  try{ srec && srec.stop(); }catch(e){}
  srec = null;
  updateSRecUI();
}
function updateSRecUI(){
  const btn = document.getElementById('srecToggleBtn');
  if(btn){ btn.textContent = srecActive ? 'Stop recording' : 'Start recording'; btn.classList.toggle('recbtn', srecActive); btn.classList.toggle('off', !srecActive); }
  const banner = document.getElementById('srecBanner');
  if(banner){
    if(srecState==='listening') banner.outerHTML = `<div id="srecBanner" class="recbanner live"><span class="dot"></span>Recording — listening</div>`;
    else if(srecState==='stalled') banner.outerHTML = `<div id="srecBanner" class="recbanner stalled">Recording stopped unexpectedly<button class="btn btn-sm" style="margin-left:auto" onclick="resumeStudentRecording()">Resume</button></div>`;
    else banner.outerHTML = `<div id="srecBanner" class="recbanner off">Ready when you are</div>`;
  }
}
function discardStudentRecording(){
  if(!confirm('Clear this recording? This cannot be undone.')) return;
  stopStudentRecording();
  studentRecording = { startedAt: null, transcript: [] };
  saveStudentRecording();

async function sendStudentRecording(){
  if(!studentRecording.transcript.length){ toast('Nothing recorded yet'); return; }
  const data = JSON.stringify({ kind:'lesson-copilot-recording', recordedAt: studentRecording.startedAt, studentName: studentState.student?.name||'', consentConfirmedAt: studentRecording.consentConfirmedAt||null, transcript: studentRecording.transcript }, null, 2);
  const prefix = studentState.student?.name ? slugify(studentState.student.name)+'-' : '';
  const filename = prefix+'recording-'+new Date(studentRecording.startedAt||Date.now()).toISOString().slice(0,10)+'.json';
  const file = new File([data], filename, { type:'application/json' });
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    try{
      await navigator.share({ files:[file], title:'Lesson recording', text:'Here’s my ChatterCheck lesson recording for you to import.' });
      toast('Sent!');
      return;
    }catch(e){
      if(e && e.name==='AbortError') return;
    }
  }
  downloadFile(filename, data);
}

        <button class="tab ${studentTab==='record'?'active':''}" onclick="practice.active=false;studentTab='record';render()">Record lesson ${srecActive?'<span class=\"livepip\"></span>':''}</button>
        <button class="tab ${studentTab==='library'?'active':''}" onclick="practice.active=false;studentTab='library';render()">Lesson library</button>
        <button class="tab ${studentTab==='phrases'?'active':''}" onclick="practice.active=false;studentTab='phrases';render()">Useful phrases</button>
        <button class="tab ${studentTab==='facts'?'active':''}" onclick="practice.active=false;studentTab='facts';render()">Fun facts</button>
      </div>
      <div class="tabfade">${body}</div>
    </div>`;
}

/* ---------- main render ---------- */
function render(){
  if(STUDENT_MODE) return renderStudentApp();
  clearInterval(timerHandle); timerHandle=null;

  if(state.students.length===0){
    document.getElementById('app').innerHTML = renderHeader() + `
    <div class="shell" style="padding-top:0">
      <div class="emptystate">
        <h2>Set up your first student</h2>
        <p>ChatterCheck sits beside your call. Turn on recording and it transcribes the session live, highlighting moments worth a look — you review and tag them whenever you have time. It keeps a running file per student with their progression and glossary.</p>
        <button class="btn btn-primary" onclick="openAddStudent()">Add a student</button>
      </div>
    </div>`;
    return;
  }

  const st = activeStudent();
  const live = st ? liveMistakeFor(st) : null;
  const body =
    view==='dashboard' ? renderDashboard() :
    practice.active ? renderPractice(st) :
    (view==='file' && reviewSessionId) ? renderReview(st) :
    (view==='file' && cheatSheetMode) ? renderCheatSheet(st) :
    view==='session' ? renderSession(st) : renderFile(st);

  document.getElementById('app').innerHTML = renderHeader() + `
    <div class="shell" style="padding-top:0">
      <div class="tabs no-print">
        <button class="tab ${view==='dashboard'?'active':''}" onclick="practice.active=false;reviewSessionId=null;cheatSheetMode=false;view='dashboard';render()">Dashboard</button>
        <button class="tab ${view==='session'?'active':''}" onclick="practice.active=false;reviewSessionId=null;cheatSheetMode=false;view='session';render()">Live session ${live?'<span class=\"livepip\"></span>':''}</button>
        <button class="tab ${view==='file'?'active':''}" onclick="practice.active=false;reviewSessionId=null;cheatSheetMode=false;view='file';render()">Student file</button>
      </div>
      ${body}
    </div>`;

  if(live && view==='session' && !practice.active){
    tickTimer();
    timerHandle = setInterval(tickTimer, 1000);
  }
}

if(state.students.length && !state.activeStudentId) state.activeStudentId = state.students[0].id;
render();
</script>
